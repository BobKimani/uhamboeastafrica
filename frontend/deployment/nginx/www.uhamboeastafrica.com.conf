# Nginx (host) site for https://www.uhamboeastafrica.com (Next.js frontend)
#
#   www.uhamboeastafrica.com  -> Next.js container on 127.0.0.1:3000
#   uhamboeastafrica.com      -> 301 to https://www.uhamboeastafrica.com
#
# The browser calls the API directly at https://api.uhamboeastafrica.com (see
# backend/deployment/nginx/api.uhamboeastafrica.com.conf). Requests to
# www.../api/* are proxied by Next.js itself (next.config.ts rewrite) to
# BACKEND_API_URL, so no separate /api location is needed here.
#
# Install (on the VPS, after review):
#   sudo cp www.uhamboeastafrica.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/www.uhamboeastafrica.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate paths assume Certbot with one certificate covering both names:
#   sudo certbot certonly --nginx -d www.uhamboeastafrica.com -d uhamboeastafrica.com

server {
    listen 80;
    listen [::]:80;
    server_name www.uhamboeastafrica.com uhamboeastafrica.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.uhamboeastafrica.com$request_uri;
    }
}

# Apex -> www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name uhamboeastafrica.com;

    ssl_certificate     /etc/letsencrypt/live/www.uhamboeastafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.uhamboeastafrica.com/privkey.pem;

    return 301 https://www.uhamboeastafrica.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.uhamboeastafrica.com;

    ssl_certificate     /etc/letsencrypt/live/www.uhamboeastafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.uhamboeastafrica.com/privkey.pem;

    # Uploads normally go straight to the API host; this covers the
    # same-origin /api proxy path. Keep >= backend MEDIA_MAX_UPLOAD_BYTES.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (do not append) so the backend's rate limiting sees the
        # real client address when requests come through the Next.js proxy.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Allow streamed (Suspense) responses to flush immediately.
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
