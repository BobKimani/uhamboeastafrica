# Nginx (host) site for https://api.uhamboeastafrica.com
#
#   /media/*  -> served directly from /srv/uhambo/uploads (no FastAPI involved)
#   /*        -> FastAPI backend container on 127.0.0.1:8000
#
# Install (on the VPS, after review):
#   sudo cp api.uhamboeastafrica.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.uhamboeastafrica.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate paths assume Certbot; adjust if certificates are managed differently.
# If Nginx runs in a container instead of on the host, mount the media directory
# read-only (e.g. /srv/uhambo/uploads:/srv/uhambo/uploads:ro) and replace
# 127.0.0.1:8000 with http://backend:8000 on the shared Docker network.

server {
    listen 80;
    listen [::]:80;
    server_name api.uhamboeastafrica.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.uhamboeastafrica.com;

    ssl_certificate     /etc/letsencrypt/live/api.uhamboeastafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uhamboeastafrica.com/privkey.pem;

    # Must be >= MEDIA_MAX_UPLOAD_BYTES (10 MB default) plus multipart overhead.
    client_max_body_size 12m;

    # ---------------------------------------------------------------- media
    # Image files only, served straight from disk. Nginx normalises the URI
    # (resolving "..") before matching, so requests cannot escape the root.
    # Hidden files/segments (e.g. in-progress ".upload-*.tmp") never match.
    location ~* ^/media/(?<media_path>(?!\.)(?!.*/\.).+\.(?:jpe?g|png|gif|webp|avif|ico))$ {
        alias /srv/uhambo/uploads/$media_path;

        limit_except GET HEAD { deny all; }
        disable_symlinks on;

        # Never let a stored file be interpreted as HTML/script.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        # Upload keys are unique (timestamp + random token), so cache for a week.
        add_header Cache-Control "public, max-age=604800" always;

        access_log off;
        log_not_found off;
    }

    # Anything else under /media/ (directories, other file types) is not served.
    location /media/ {
        autoindex off;
        return 404;
    }

    # -------------------------------------------------------------- FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (do not append to) any client-supplied X-Forwarded-For:
        # uvicorn uses the left-most entry as the client IP for login rate
        # limiting, so it must be the address Nginx actually saw.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
